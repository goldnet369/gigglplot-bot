name: Post Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Song topic (leave empty for random)"
        required: false
        default: ""
      privacy:
        description: "private or public"
        required: true
        default: "private"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts pillow numpy requests google-api-python-client google-auth
      - name: Make and upload video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SONG_TOPIC: ${{ github.event.inputs.topic }}
          PRIVACY: ${{ github.event.inputs.privacy }}
        run: python main.py
